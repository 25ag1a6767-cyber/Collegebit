<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070d18">
  <title>CampusBite AI · Live Token Display Board</title>
  <style>
    :root {
      --bg: #070d18;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --ready-bg: #064e3b;
      --ready-border: #10b981;
      --ready-text: #6ee7b7;
      --prep-bg: #451a03;
      --prep-border: #f59e0b;
      --prep-text: #fde68a;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      background: #0b1324;
      border-bottom: 2px solid #1e293b;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title small {
      font-size: 14px;
      color: var(--muted);
      font-weight: 500;
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .clock-display {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f1f5f9;
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    select, button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover, select:hover { background: #2d3f59; }
    .btn-active { border-color: #10b981; color: #6ee7b7; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 24px 28px;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .board-column {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .col-header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--card-border);
    }
    .col-header.ready {
      background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
      color: #a7f3d0;
    }
    .col-header.prep {
      background: linear-gradient(135deg, #78350f 0%, #451a03 100%);
      color: #fde68a;
    }
    .col-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .col-count {
      font-size: 18px;
      background: rgba(0,0,0,0.3);
      padding: 4px 14px;
      border-radius: 999px;
      font-weight: 700;
    }
    .tokens-container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      overflow-y: auto;
      max-height: 60vh;
    }
    .token-card {
      border-radius: 12px;
      padding: 16px 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .token-card.ready {
      background: var(--ready-bg);
      border: 2px solid var(--ready-border);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
    }
    .token-card.ready.flash {
      animation: pulse-ready 1.5s infinite;
    }
    @keyframes pulse-ready {
      0%, 100% { box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
      50% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.9); transform: scale(1.02); }
    }
    .token-card.prep {
      background: var(--prep-bg);
      border: 2px solid var(--prep-border);
    }
    .token-number {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .token-card.ready .token-number { color: #ffffff; }
    .token-card.prep .token-number { color: #fef3c7; }
    .token-counter {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .token-card.ready .token-counter { color: #a7f3d0; }
    .token-card.prep .token-counter { color: #fde68a; }
    .token-time {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 18px;
      font-style: italic;
    }

    footer {
      background: #090e1a;
      border-top: 2px solid #1e293b;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .collected-ticker {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .collected-label {
      font-size: 14px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .collected-tokens {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .collected-badge {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: line-through;
    }
    .privacy-notice {
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      <span>CAMPUSBITE AI</span>
      <small>CANTEEN TOKEN DISPLAY BOARD</small>
    </div>
    <div class="header-controls">
      <select id="counter-select" aria-label="Select preparation counter">
        <option value="">All Canteen Counters</option>
      </select>
      <button type="button" id="chime-toggle" class="btn-active" title="Toggle audio alert when order is ready">🔔 Sound: ON</button>
      <button type="button" id="fullscreen-btn" title="Toggle Fullscreen">⛶ Fullscreen</button>
      <div id="clock" class="clock-display">--:--:--</div>
    </div>
  </header>

  <main>
    <!-- Ready for Pickup Column -->
    <section class="board-column">
      <div class="col-header ready">
        <div class="col-title">🟢 READY FOR PICKUP</div>
        <div id="ready-count" class="col-count">0 Orders</div>
      </div>
      <div id="ready-tokens-grid" class="tokens-container">
        <div class="empty-state">No orders ready for collection right now.</div>
      </div>
    </section>

    <!-- Now Preparing Column -->
    <section class="board-column">
      <div class="col-header prep">
        <div class="col-title">🟡 NOW PREPARING</div>
        <div id="prep-count" class="col-count">0 Orders</div>
      </div>
      <div id="prep-tokens-grid" class="tokens-container">
        <div class="empty-state">Kitchen queue is clear.</div>
      </div>
    </section>
  </main>

  <footer>
    <div class="collected-ticker">
      <span class="collected-label">Recently Collected:</span>
      <div id="collected-tokens-list" class="collected-tokens">
        <span class="collected-badge">CB-000</span>
      </div>
    </div>
    <div class="privacy-notice">
      Live Token Board &middot; Privacy compliant: No student names, college IDs, or payment details displayed.
    </div>
  </footer>

  <script>
    (function () {
      "use strict";

      let soundEnabled = true;
      let lastKnownReadySet = new Set();
      let audioCtx = null;

      function playChime() {
        if (!soundEnabled) return;
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }
          const now = audioCtx.currentTime;
          // Pleasant high-two-tone ding-dong
          const osc1 = audioCtx.createOscillator();
          const gain1 = audioCtx.createGain();
          osc1.type = "sine";
          osc1.frequency.setValueAtTime(587.33, now); // D5
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
          gain1.gain.setValueAtTime(0.25, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc1.connect(gain1);
          gain1.connect(audioCtx.destination);
          osc1.start(now);
          osc1.stop(now + 0.6);
        } catch (_) {}
      }

      function updateClock() {
        const d = new Date();
        document.getElementById("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      }
      setInterval(updateClock, 1000);
      updateClock();

      const chimeBtn = document.getElementById("chime-toggle");
      chimeBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        chimeBtn.textContent = soundEnabled ? "🔔 Sound: ON" : "🔕 Sound: OFF";
        chimeBtn.className = soundEnabled ? "btn-active" : "";
        if (soundEnabled && !audioCtx) {
          try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
        }
      });

      const fsBtn = document.getElementById("fullscreen-btn");
      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      async function fetchDisplayData() {
        const counterVal = document.getElementById("counter-select").value;
        const q = counterVal ? "?counterId=" + encodeURIComponent(counterVal) : "";
        try {
          const res = await fetch("/api/v1/queue/display-board" + q, { cache: "no-store" });
          if (!res.ok) return;
          const body = await res.json();
          const data = body.data || body;
          renderBoard(data);
        } catch (_) {}
      }

      function renderBoard(data) {
        // Populate counters dropdown once if empty
        const sel = document.getElementById("counter-select");
        if (sel.options.length <= 1 && Array.isArray(data.counters)) {
          data.counters.forEach((c) => {
            const opt = document.createElement("option");
            opt.value = String(c.id);
            opt.textContent = c.name + (c.location ? " (" + c.location + ")" : "");
            sel.appendChild(opt);
          });
        }

        const readyTokens = data.readyTokens || [];
        const prepTokens = data.preparingTokens || [];
        const collectedTokens = data.recentlyCollected || [];

        // Check for new ready tokens to sound chime
        const currentReadyIds = new Set(readyTokens.map((t) => t.orderId || t.tokenNumber));
        let hasNewReady = false;
        if (lastKnownReadySet.size > 0) {
          for (const id of currentReadyIds) {
            if (!lastKnownReadySet.has(id)) {
              hasNewReady = true;
              break;
            }
          }
        }
        lastKnownReadySet = currentReadyIds;
        if (hasNewReady) {
          playChime();
        }

        // Render Ready column
        document.getElementById("ready-count").textContent = `${readyTokens.length} Order${readyTokens.length === 1 ? "" : "s"}`;
        const readyGrid = document.getElementById("ready-tokens-grid");
        if (!readyTokens.length) {
          readyGrid.innerHTML = '<div class="empty-state">No orders ready for collection right now.</div>';
        } else {
          readyGrid.innerHTML = "";
          readyTokens.forEach((t) => {
            const card = document.createElement("div");
            card.className = "token-card ready flash";
            card.innerHTML = `
              <div class="token-number">${t.tokenDisplay || ("#" + t.tokenNumber)}</div>
              <div class="token-counter">${t.counterName || "Main Counter"}</div>
              <div class="token-time">Ready ${t.readyMinsAgo <= 0 ? "just now" : t.readyMinsAgo + "m ago"}</div>
            `;
            readyGrid.appendChild(card);
          });
        }

        // Render Preparing column
        document.getElementById("prep-count").textContent = `${prepTokens.length} Order${prepTokens.length === 1 ? "" : "s"}`;
        const prepGrid = document.getElementById("prep-tokens-grid");
        if (!prepTokens.length) {
          prepGrid.innerHTML = '<div class="empty-state">Kitchen queue is clear.</div>';
        } else {
          prepGrid.innerHTML = "";
          prepTokens.forEach((t) => {
            const card = document.createElement("div");
            card.className = "token-card prep";
            card.innerHTML = `
              <div class="token-number">${t.tokenDisplay || ("#" + t.tokenNumber)}</div>
              <div class="token-counter">${t.counterName || "Main Counter"}</div>
              <div class="token-time">In Preparation</div>
            `;
            prepGrid.appendChild(card);
          });
        }

        // Render Recently Collected
        const colList = document.getElementById("collected-tokens-list");
        if (!collectedTokens.length) {
          colList.innerHTML = '<span class="privacy-notice">None yet today</span>';
        } else {
          colList.innerHTML = "";
          collectedTokens.slice(0, 10).forEach((t) => {
            const badge = document.createElement("span");
            badge.className = "collected-badge";
            badge.textContent = t.tokenDisplay || ("#" + t.tokenNumber);
            badge.title = `${t.counterName || "Counter"} - Handed Over`;
            colList.appendChild(badge);
          });
        }
      }

      document.getElementById("counter-select").addEventListener("change", fetchDisplayData);

      // WebSocket live updates + 5-second polling fallback
      function connectWs() {
        const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${proto}//${window.location.host}/api/v1/ws`;
        let ws;
        try {
          ws = new WebSocket(wsUrl);
          ws.onmessage = function (ev) {
            try {
              const msg = JSON.parse(ev.data);
              if (msg.topic === "queue.public" || msg.topic === "order.ready" || msg.topic === "order.collected") {
                fetchDisplayData();
              }
            } catch (_) {}
          };
          ws.onclose = function () {
            setTimeout(connectWs, 4000);
          };
        } catch (_) {
          setTimeout(connectWs, 5000);
        }
      }

      connectWs();
      fetchDisplayData();
      setInterval(fetchDisplayData, 5000);
    })();
  </script>
</body>
</html>
