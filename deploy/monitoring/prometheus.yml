global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "collegebits-api"
    metrics_path: "/api/metrics"
    authorization:
      type: Bearer
      credentials_file: "/etc/prometheus/metrics_token"
    static_configs:
      - targets:
          - "api-1:8000"
          - "api-2:8000"
          - "api-3:8000"
          - "api-4:8000"
