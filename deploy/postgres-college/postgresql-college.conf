# CampusBite AI v2.0 — Self-Hosted College PostgreSQL 16 Configuration
# Place in PostgreSQL conf.d/ (e.g. /etc/postgresql/16/main/conf.d/campusbite.conf)
# Tuned for college-owned server hardware (8 GB RAM, 4 vCPU SSD baseline; adjust proportionally).

listen_addresses = '127.0.0.1'          # Bind loopback only when app/PgBouncer runs on same host
port = 5432
max_connections = 120
password_encryption = 'scram-sha-256'

# Memory & Query Planner
shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 16MB
maintenance_work_mem = 256MB
random_page_cost = 1.1
effective_io_concurrency = 200

# Write-Ahead Log (WAL) & Continuous Archiving for Point-in-Time Disaster Recovery
wal_level = replica
archive_mode = on
archive_timeout = 300s
# Copy completed WAL segments to independent/off-disk archive storage:
archive_command = 'test ! -f /var/backups/campusbite-wal/%f && cp %p /var/backups/campusbite-wal/%f'
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# Observability & Slow Query Tracking
shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 500        # Log queries slower than 500 ms
log_checkpoints = on
log_lock_waits = on
deadlock_timeout = 1s
