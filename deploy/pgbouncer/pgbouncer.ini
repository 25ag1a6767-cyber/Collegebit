;; CampusBite AI v2.0 — PgBouncer Connection Pooler Configuration
;; Sits between CampusBite FastAPI workers and self-hosted College PostgreSQL.

[databases]
campusbite_prod = host=db port=5432 dbname=ace_canteen

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 600
server_lifetime = 3600
ignore_startup_parameters = extra_float_digits,options
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
