name: CollegeBits Customer iOS App

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-build.yml"

jobs:
  # Always runs on fast Ubuntu runners: verifies TypeScript, generates the native
  # Xcode project (ios/), compiles the production iOS Hermes bytecode bundle, and
  # publishes the iOS bundle & configuration assets to the release.
  build-ios-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://www.collegebits.com' }}
      NODE_ENV: production
      CI: "1"
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies & typecheck
        run: |
          npm ci --include=dev
          npm run typecheck

      - name: Prebuild native iOS Xcode project
        run: |
          npx expo prebuild --platform ios --no-install
          test -d ios

      - name: Export production iOS Hermes bundle
        run: |
          npx expo export --platform ios --output-dir dist-ios
          test -f dist-ios/metadata.json

      - name: Package iOS bundle & Xcode project archive
        run: |
          zip -qry /tmp/CollegeBits-iOS-Bundle.zip ios dist-ios app.json eas.json
          ls -lh /tmp/CollegeBits-iOS-Bundle.zip

      - name: Publish iOS bundle to customer-app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="customer-app-latest"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CollegeBits Customer Mobile Apps (Android & iOS)" --notes "Latest Android APK and iOS App Bundle." --prerelease --latest=false
          fi
          gh release upload "$TAG" /tmp/CollegeBits-iOS-Bundle.zip --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload iOS bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: collegebits-customer-ios-bundle
          path: /tmp/CollegeBits-iOS-Bundle.zip
          if-no-files-found: error

  # Runs when an Expo token is configured: signed iOS build + TestFlight/App Store
  # submission through EAS.
  build-ios-testflight:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check for Expo credentials
        id: creds
        working-directory: .
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "EXPO_TOKEN secret not set; skipping signed TestFlight build."; fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.enabled == 'true'

      - name: Setup Node.js 20
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.creds.outputs.enabled == 'true'
        run: npm ci --include=dev

      - name: Signed iOS build and submit to TestFlight
        if: steps.creds.outputs.enabled == 'true'
        run: npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --no-wait --auto-submit
