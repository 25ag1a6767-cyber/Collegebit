name: CampusBite AI v2.0 — Android APK & AAB Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & typecheck
        run: |
          npm install
          npm run typecheck

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK & Play Store AAB
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: campusbite-ai-v2-android-releases
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
