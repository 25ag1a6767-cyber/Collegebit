name: CollegeBits Customer Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://app-sai-e3e1.vercel.app
      NODE_ENV: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "$SDKMANAGER" --licenses
          license_status=${PIPESTATUS[1]}
          set -e
          if [ "$license_status" -ne 0 ]; then exit "$license_status"; fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies & typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone Android release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publish latest Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" /tmp/CollegeBits-Customer.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          TAG="customer-app-latest"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CollegeBits Customer Android APK" --notes "Latest standalone sideload APK for Android. It is debug-signed, not a Play Store release. A new APK may require uninstalling the previous build before installing." --prerelease --latest=false
          fi
          gh release upload "$TAG" /tmp/CollegeBits-Customer.apk --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: collegebits-customer-android-apk
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
